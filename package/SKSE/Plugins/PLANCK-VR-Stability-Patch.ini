[Settings]
; Settings are read during plugin startup. Restart Skyrim after changes.

; Keep the dump-proven SHIELD animation binding correction enabled.
; Set false only to isolate the 1.3.x rebinding path during diagnosis.
enableWeaponNodeRebinding=true

; Keep the broader 1.3.0 WEAPON and WeaponBack coverage disabled.
; Set true only when testing the wider diagnostic mode.
rebindUnobservedWeaponNodes=false

; Keep PLANCK's guarded HIGGS hand/weapon collision-quality refresh enabled.
; Set false only to isolate that refresh path. This does not disable HIGGS.
enableHiggsBodyReportingQualityRefresh=true
